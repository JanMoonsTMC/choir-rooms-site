<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Our content model</title>
  <desc id="d">Four collections. Equipment and Rooms are many-to-many. One room has many time slots. One time slot has many bookings.</desc>
  <rect width="760" height="330" fill="#fffcf5"/>
  <g fill="#ffffff" stroke="#1f2433" stroke-width="2">
    <rect x="20" y="50" width="150" height="110" rx="8"/>
    <rect x="270" y="50" width="150" height="150" rx="8"/>
    <rect x="270" y="250" width="150" height="60" rx="8"/>
    <rect x="590" y="50" width="150" height="150" rx="8"/>
  </g>
  <g stroke="#1f2433" stroke-width="2" fill="none">
    <line x1="170" y1="105" x2="270" y2="105"/>
    <line x1="184" y1="105" x2="170" y2="95"/>
    <line x1="184" y1="105" x2="170" y2="115"/>
    <line x1="256" y1="105" x2="270" y2="95"/>
    <line x1="256" y1="105" x2="270" y2="115"/>
    <line x1="345" y1="200" x2="345" y2="250"/>
    <line x1="335" y1="212" x2="355" y2="212"/>
    <line x1="345" y1="236" x2="335" y2="250"/>
    <line x1="345" y1="236" x2="355" y2="250"/>
    <line x1="420" y1="280" x2="665" y2="280"/>
    <line x1="665" y1="280" x2="665" y2="200"/>
    <line x1="432" y1="270" x2="432" y2="290"/>
    <line x1="665" y1="214" x2="655" y2="200"/>
    <line x1="665" y1="214" x2="675" y2="200"/>
  </g>
  <g fill="#1f2433">
    <text x="95" y="76" text-anchor="middle" font-size="16" font-weight="bold">Equipment</text>
    <text x="32" y="102" font-size="13">name</text>
    <text x="32" y="121" font-size="13">slug</text>
    <text x="32" y="140" font-size="13">description</text>
    <text x="345" y="76" text-anchor="middle" font-size="16" font-weight="bold">Rooms</text>
    <text x="282" y="102" font-size="13">name, slug</text>
    <text x="282" y="121" font-size="13">capacity</text>
    <text x="282" y="140" font-size="13">price</text>
    <text x="282" y="159" font-size="13">location, summary</text>
    <text x="282" y="178" font-size="13">description, image</text>
    <text x="345" y="276" text-anchor="middle" font-size="16" font-weight="bold">Time slots</text>
    <text x="345" y="297" text-anchor="middle" font-size="13">startsAt, endsAt, places</text>
    <text x="665" y="76" text-anchor="middle" font-size="16" font-weight="bold">Bookings</text>
    <text x="602" y="102" font-size="13">groupName</text>
    <text x="602" y="121" font-size="13">groupSize</text>
    <text x="602" y="140" font-size="13">name, email</text>
    <text x="602" y="159" font-size="13">note</text>
    <text x="602" y="178" font-size="13">requestId</text>
    <text x="220" y="90" text-anchor="middle" font-size="12">many to many</text>
    <text x="360" y="230" font-size="12">one room, many time slots</text>
    <text x="545" y="270" text-anchor="middle" font-size="12">one time slot, many bookings</text>
    <text x="20" y="26" font-size="14">Riverside Voices: our four collections and how they link</text>
  </g>
</svg>
